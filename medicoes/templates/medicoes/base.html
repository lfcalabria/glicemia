<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Glicemia{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
        header { background: #1e3a5f; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header nav a { color: #cfe3ff; margin-left: 16px; text-decoration: none; }
        header nav a:hover { color: #fff; text-decoration: underline; }
        main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
        .mensagens { max-width: 1100px; margin: 12px auto 0; padding: 0 16px; }
        .mensagens .success { background: #d4edda; border: 1px solid #9ad5a8; color: #1d6b31; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .mensagens .info { background: #e2eef9; border: 1px solid #9ec5e8; color: #14497e; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .mensagens .error { background: #f8d7da; border: 1px solid #e8a1a8; color: #7a1f26; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .mensagens .warning { background: #fff3cd; border: 1px solid #e8d49a; color: #6b5515; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        table { border-collapse: collapse; width: 100%; background: #fff; }
        th, td { border: 1px solid #d5dbe1; padding: 6px 8px; text-align: center; font-size: 14px; }
        th { background: #eef2f6; }
        td.data { font-weight: bold; white-space: nowrap; }
        .completo { background: #e6f7ec; }
        form label { display: block; margin: 12px 0 4px; font-weight: 600; }
        form input, form select { padding: 6px 8px; }
        .botoes { margin-top: 16px; }
        .botoes button { padding: 8px 16px; cursor: pointer; }
        .grid-dia { display: grid; grid-template-columns: auto repeat(2, minmax(140px, 220px)); gap: 8px; align-items: center; margin-bottom: 10px; }
        .grid-dia .rotulo { font-weight: 600; }
        .ja-preenchido { opacity: 0.55; }
        .erro { color: #a11; font-size: 13px; }
        .tabela-admin th, .tabela-admin td { font-size: 12px; padding: 4px 5px; }
        .tabela-admin input { width: 60px; }
        .tabela-admin input[type="time"] { width: 92px; }
        .seletores { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
        .card { background: #fff; border: 1px solid #d5dbe1; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .btn-pdf { display: inline-block; background: #1e3a5f; color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none; }
        .btn-pdf:hover { background: #2c4f7c; }
        .tabela-dias td.alto { background: #f5b7b1; color: #7b241c; font-weight: bold; }
        .tabela-dias td.baixo { background: #fcf3cf; color: #7d6608; font-weight: bold; }
        .tabela-dias td.normal { background: #eafaf1; }
        .tabela-dias td.vazio { background: #f2f3f4; color: #95a5a6; }
        td.celula.alto { background: #f5b7b1; color: #7b241c; font-weight: bold; }
        td.celula.baixo { background: #fcf3cf; color: #7d6608; font-weight: bold; }
        td.celula.normal { background: #eafaf1; }
        td.celula.vazio { background: #f2f3f4; color: #95a5a6; }
        .legenda { font-size: 13px; color: #555; }
        .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #bbb; vertical-align: middle; margin-right: 3px; }
        .sw-alto { background: #f5b7b1; }
        .sw-baixo { background: #fcf3cf; }
        .sw-normal { background: #eafaf1; }
    </style>
</head>
<body>
    <header>
        <strong>Controle de Glicemia</strong>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'medicoes:painel' %}">Painel</a>
                <a href="{% url 'medicoes:historico' %}">Histórico</a>
                <a href="{% url 'medicoes:analise' %}">Análise</a>
                <a href="{% url 'medicoes:medicamentos' %}">Medicamentos</a>
                {% if user.is_superuser %}
                    <a href="{% url 'medicoes:admin_marcacoes' %}">Admin marcações</a>
                {% endif %}
                <form method="post" action="{% url 'medicoes:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:#cfe3ff;cursor:pointer;">Sair ({{ user.username }})</button>
                </form>
            {% endif %}
        </nav>
    </header>

    <div class="mensagens">
        {% for mensagem in messages %}
            <div class="{{ mensagem.tags }}">{{ mensagem }}</div>
        {% endfor %}
    </div>

    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
